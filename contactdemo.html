<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Request Demo - GuardianAI</title>
    <style>
        :root {
            --primary: #6E56CF;
            --dark-bg: #09090b;
            --text-color: #F5F5F7;
            --secondary-bg: rgba(255, 255, 255, 0.05);
            --glow: 0 0 30px rgba(110, 86, 207, 0.15);
            --accent: #82F7FF;
        }

        body {
            background: linear-gradient(135deg, var(--dark-bg) 0%, #13151C 100%);
            color: var(--text-color);
            font-family: -apple-system, BlinkMacSystemFont, 'SF Pro Display', sans-serif;
            -webkit-font-smoothing: antialiased;
            margin: 0;
            min-height: 100vh;
        }

        .grid-lines {
            position: fixed;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            background-image: 
                linear-gradient(rgba(130, 247, 255, 0.05) 1px, transparent 1px),
                linear-gradient(90deg, rgba(130, 247, 255, 0.05) 1px, transparent 1px);
            background-size: 50px 50px;
            z-index: -1;
            opacity: 0;
            animation: gridFadeIn 1.5s ease-out forwards;
        }

        .container {
            width: 90%;
            max-width: 800px;
            margin: 2rem auto;
            padding: 3rem;
            background: rgba(22, 22, 23, 0.7);
            backdrop-filter: blur(20px);
            -webkit-backdrop-filter: blur(20px);
            border-radius: 30px;
            border: 1px solid rgba(255, 255, 255, 0.1);
            box-shadow: var(--glow);
            opacity: 0;
            animation: fadeInUp 1s ease-out forwards;
        }

        h1 {
            font-size: clamp(40px, 5vw, 56px);
            font-weight: 700;
            letter-spacing: -0.03em;
            background: linear-gradient(135deg, var(--accent) 0%, var(--primary) 100%);
            -webkit-background-clip: text;
            -webkit-text-fill-color: transparent;
            margin-bottom: 1.5em;
            text-align: center;
            text-shadow: var(--glow);
        }

        .form-group {
            margin-bottom: 2rem;
            opacity: 0;
            animation: fadeInUp 0.8s ease-out forwards;
        }

        .form-group:nth-child(2) { animation-delay: 0.2s; }
        .form-group:nth-child(3) { animation-delay: 0.3s; }
        .form-group:nth-child(4) { animation-delay: 0.4s; }
        .form-group:nth-child(5) { animation-delay: 0.5s; }

        label {
            display: block;
            margin-bottom: 0.8rem;
            font-size: 17px;
            font-weight: 500;
            color: var(--accent);
        }

        input, textarea {
            width: 100%;
            padding: 1.2rem;
            background: rgba(110, 86, 207, 0.05);
            border: 1px solid rgba(255, 255, 255, 0.1);
            border-radius: 16px;
            color: var(--text-color);
            font-family: inherit;
            font-size: 16px;
            transition: all 0.3s ease;
            backdrop-filter: blur(10px);
        }

        input:focus, textarea:focus {
            outline: none;
            border-color: var(--primary);
            background: rgba(110, 86, 207, 0.1);
            box-shadow: var(--glow);
        }

        textarea {
            min-height: 150px;
            resize: vertical;
        }

        .submit-button {
            display: block;
            padding: 1.2rem 3.5rem;
            background: linear-gradient(135deg, var(--primary) 0%, #4B3B8F 100%);
            color: white;
            border: none;
            border-radius: 980px;
            font-size: 17px;
            font-weight: 500;
            cursor: pointer;
            transition: all 0.3s ease;
            margin: 3rem auto 1rem;
            position: relative;
            overflow: hidden;
            opacity: 0;
            animation: fadeInUp 0.8s ease-out forwards 0.6s;
        }

        .submit-button::after {
            content: '';
            position: absolute;
            top: 0;
            left: -100%;
            width: 100%;
            height: 100%;
            background: linear-gradient(
                90deg,
                transparent,
                rgba(255, 255, 255, 0.2),
                transparent
            );
            transition: 0.5s;
        }

        .submit-button:hover::after {
            left: 100%;
        }

        .submit-button:hover {
            transform: translateY(-2px);
            box-shadow: var(--glow);
        }

        .thank-you-message {
            display: none;
            text-align: center;
            font-size: 28px;
            background: linear-gradient(135deg, var(--accent) 0%, var(--primary) 100%);
            -webkit-background-clip: text;
            -webkit-text-fill-color: transparent;
            margin-top: 2rem;
            animation: fadeIn 1s ease-out forwards;
        }

        @keyframes fadeIn {
            0% { opacity: 0; transform: translateY(20px); }
            100% { opacity: 1; transform: translateY(0); }
        }

        @keyframes fadeInUp {
            0% {
                opacity: 0;
                transform: translateY(20px);
            }
            100% {
                opacity: 1;
                transform: translateY(0);
            }
        }

        @keyframes gridFadeIn {
            0% {
                opacity: 0;
                transform: scale(1.1);
            }
            100% {
                opacity: 0.5;
                transform: scale(1);
            }
        }

        @media screen and (max-width: 768px) {
            .container {
                width: 95%;
                padding: 2rem;
                margin: 1rem auto;
            }

            h1 {
                font-size: 36px;
            }

            input, textarea {
                padding: 1rem;
            }
        }
    </style>
</head>
<body>
    <div class="grid-lines"></div>
    <div class="container">
        <h1>Request a Demo</h1>
        <form id="demoForm" action="https://formsubmit.co/gsbusiness@guardiansafe.org" method="POST">
            <!-- Add these hidden inputs for FormSubmit configuration -->
            <input type="hidden" name="_subject" value="New Demo Request from GuardianAI">
            <input type="hidden" name="_template" value="table">
            <input type="hidden" name="_next" value="https://GuardianSafeai.com/index.html">
            
            <div class="form-group">
                <label for="name">Name</label>
                <input type="text" id="name" name="name" required>
            </div>
            
            <div class="form-group">
                <label for="email">Email</label>
                <input type="email" id="email" name="email" required>
            </div>
            
            <div class="form-group">
                <label for="company">Organization (Company, School, or Business)</label>
                <input type="text" id="company" name="company" required>
            </div>
            
            <div class="form-group">
                <label for="message">Message</label>
                <textarea id="message" name="message" placeholder="Tell us about your security needs..."></textarea>
            </div>
            
            <button type="submit" class="submit-button">Send Request</button>
        </form>
        <div class="thank-you-message" id="thankYouMessage">
            Thank you for your request! We'll get back to you soon.
        </div>
    </div>

    <script>
        document.addEventListener('DOMContentLoaded', function() {
            const container = document.querySelector('.container');
            container.style.opacity = '0';
            container.style.transition = 'opacity 1s ease-in';
            
            setTimeout(() => {
                container.style.opacity = '1';
            }, 500);

            const form = document.getElementById('demoForm');
            const thankYouMessage = document.getElementById('thankYouMessage');

            form.addEventListener('submit', function(event) {
                event.preventDefault(); // Prevent the default form submission
                thankYouMessage.style.display = 'block'; // Show the thank you message
                form.style.display = 'none'; // Hide the form
                setTimeout(() => {
                    form.submit(); // Submit the form after showing the message
                }, 2000); // Delay to allow the animation to play
            });
        });
    </script>
</body>
</html>
